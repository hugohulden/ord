<style>
/* Layout: one calm column, thumb-sized controls, bottom tab bar; diff letters set in mono so they line up.
   Dark-only by request ("mörkt läge"). */
:root {
  color-scheme: dark;
  --bg: #11131a;
  --surface: #1a1e29;
  --surface-2: #232838;
  --line: #2e3446;
  --fg: #eceff7;
  --muted: #9aa3b8;
  --accent: #7c9fff;
  --accent-ink: #0d1430;
  --again: #f26b62;
  --hard: #f2a44b;
  --good: #4cc38a;
  --easy: #5aaaf2;
  --idea: #f2d16b;
  --pron: #b18cff;
  --spell: #45c7c0;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --font-display: "Bricolage Grotesque", "Atkinson Hyperlegible", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 16px;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
#app {
  max-width: 560px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 16px;
}
body.in-session #app { padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 30px; font-weight: 800; }
h2 { font-size: 23px; font-weight: 800; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row > * { min-width: 0; }
.grow { flex: 1 1 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.spacer { flex: 1; }
.eyebrow { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: 0.4; cursor: default; }
.btn {
  min-height: 56px; padding: 0 18px; border-radius: var(--r);
  font-weight: 700; font-size: 18px;
  background: var(--surface-2); color: var(--fg);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--muted); min-height: 44px; font-weight: 400; font-size: 16px; }
.btn.small { min-height: 46px; font-size: 16px; }
.btn:active:not(:disabled) { transform: scale(0.98); }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.card { background: var(--surface); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }

/* Home */
.hero-start { min-height: 112px; flex-direction: column; gap: 4px; border-radius: 22px; }
.hero-start .big { font-family: var(--font-display); font-size: 26px; font-weight: 800; }
.hero-start .sub { font-weight: 400; font-size: 16px; opacity: 0.85; }
.streak { display: flex; align-items: baseline; gap: 10px; }
.streak .n { font-family: var(--font-display); font-size: 56px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }

/* Word in a card */
.word-big { font-family: var(--font-display); font-weight: 800; font-size: clamp(34px, 11vw, 52px); text-align: center; overflow-wrap: anywhere; line-height: 1.1; padding: 10px 0; }
.sv { text-align: center; color: var(--muted); font-size: 19px; margin-top: -6px; }
.sv strong { color: var(--fg); }
.sv.small { font-size: 14px; }
.info { display: grid; grid-template-columns: 26px 1fr; gap: 2px 10px; align-items: start; }
.info .ic { font-size: 18px; line-height: 1.5; text-align: center; }
.info .lbl { font-size: 13px; color: var(--muted); grid-column: 2; }
.info .txt { grid-column: 2; }

/* Rating */
.rating { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rate { min-height: 66px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 700; border: 1.5px solid currentColor; background: transparent; }
.rate small { font-weight: 400; font-size: 12px; opacity: 0.85; font-variant-numeric: tabular-nums; }
.rate[data-r="1"] { color: var(--again); }
.rate[data-r="2"] { color: var(--hard); }
.rate[data-r="3"] { color: var(--good); }
.rate[data-r="4"] { color: var(--easy); }
.rate.suggested { color: var(--accent-ink); border-color: transparent; }
.rate.suggested[data-r="1"] { background: var(--again); }
.rate.suggested[data-r="2"] { background: var(--hard); }
.rate.suggested[data-r="3"] { background: var(--good); }
.rate.suggested[data-r="4"] { background: var(--easy); }

/* Inputs */
.answer {
  width: 100%; min-height: 64px; border-radius: var(--r); border: 1.5px solid var(--line);
  background: var(--surface); color: var(--fg); text-align: center;
  font-family: var(--font-mono); font-size: 26px; font-weight: 700; padding: 0 12px;
}
.answer:focus { border-color: var(--accent); outline: none; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 14px; color: var(--muted); }
.field input, .field textarea, .field select {
  width: 100%; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg);
  font: inherit; padding: 12px; min-height: 48px;
}
.field textarea { min-height: 88px; resize: vertical; }
.field input[type="file"] { padding: 10px; min-height: 0; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { min-height: 40px; border-radius: 9px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); }

/* Diff */
.diff { display: flex; flex-direction: column; gap: 10px; }
.diff .line { font-family: var(--font-mono); font-size: clamp(22px, 7vw, 32px); font-weight: 700; overflow-x: auto; white-space: nowrap; letter-spacing: 0.02em; }
.d-ok { color: var(--good); }
.d-bad { color: var(--again); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.d-extra { color: var(--again); text-decoration: line-through; text-decoration-thickness: 2px; }
.d-miss { color: var(--hard); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.d-plain { color: var(--fg); }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Mic */
.mic { width: 108px; height: 108px; border-radius: 50%; background: var(--surface-2); color: var(--accent); font-size: 40px; display: grid; place-items: center; margin: 0 auto; }
.mic.rec { background: var(--again); color: #fff; }

/* Session top bar */
.topbar { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.topbar .count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); }
.banner { background: color-mix(in srgb, var(--hard) 22%, var(--surface)); color: var(--fg); border-radius: 12px; padding: 10px 12px; font-size: 15px; }
.note { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: 15px; color: var(--muted); }

/* Lists */
.list { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r); overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--line); text-align: left; width: 100%; }
.item:first-child { border-top: 0; }
.item .t { font-weight: 700; }
.item .s { font-size: 14px; color: var(--muted); }
.item .meta { margin-left: auto; flex-shrink: 0; }
.status-new { color: var(--easy); }
.status-learning { color: var(--hard); }
.status-known { color: var(--good); }

.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--surface); border-radius: 14px; padding: 14px 8px; text-align: center; }
.tile .v { font-family: var(--font-display); font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tile .k { font-size: 13px; color: var(--muted); }

.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }

/* Tabs */
#tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  display: grid; grid-template-columns: repeat(4, 1fr);
}
#tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 52px; justify-content: center; color: var(--muted); font-size: 12px; font-weight: 700; }
#tabs button svg { width: 24px; height: 24px; }
#tabs button[aria-current="page"] { color: var(--accent); }
body.in-session #tabs { display: none; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); background: var(--surface-2); color: var(--fg); padding: 10px 16px; border-radius: 999px; font-size: 15px; z-index: 20; box-shadow: 0 6px 24px rgb(0 0 0 / 0.35); }
@media (prefers-reduced-motion: no-preference) {
  .flash-ok { animation: ok 0.5s ease-out; }
  .flash-bad { animation: bad 0.4s ease-out; }
  @keyframes ok { from { box-shadow: 0 0 0 3px var(--good); } to { box-shadow: 0 0 0 0 transparent; } }
  @keyframes bad { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
}

<script id="core">
/* ===== Ren logik: FSRS-6, stavningsdiff, felmönster, planering ===== */
const DAY = 86400000;
const W = [0.212, 1.2931, 2.3065, 8.2956, 6.4133, 0.8334, 3.0194, 0.001, 1.8722, 0.1666, 0.796,
  1.4835, 0.0614, 0.2629, 1.6483, 0.6014, 1.8729, 0.5425, 0.0912, 0.0658, 0.1542];
const RETENTION = 0.9, LEARN = [60e3, 600e3], RELEARN = [600e3], MAX_IVL = 36500;
const DECAY = -W[20], FACTOR = Math.pow(0.9, 1 / DECAY) - 1;
const S_MIN = 0.001;
// state: 0 ny, 1 lär sig, 2 repetition, 3 ominlärning

function newCard(now) { return { state: 0, step: 0, s: null, d: null, due: now, last: null, reps: 0, lapses: 0, agains: 0, introduced: null }; }
function wholeDays(a, b) { return Math.floor((b - a) / DAY); }
function retrievability(c, now) {
  if (c.last == null || c.s == null) return 0;
  return Math.pow(1 + FACTOR * Math.max(0, wholeDays(c.last, now)) / c.s, DECAY);
}
function ivlDays(s) { return Math.min(Math.max(Math.round((s / FACTOR) * (Math.pow(RETENTION, 1 / DECAY) - 1)), 1), MAX_IVL); }
const clampD = d => Math.min(Math.max(d, 1), 10);
const initS = r => Math.max(W[r - 1], S_MIN);
const initD = r => W[4] - Math.exp(W[5] * (r - 1)) + 1;
function shortS(s, r) {
  let inc = Math.exp(W[17] * (r - 3 + W[18])) * Math.pow(s, -W[19]);
  if (r > 1) inc = Math.max(inc, 1);
  return Math.max(s * inc, S_MIN);
}
function nextD(d, r) {
  const delta = -(W[6] * (r - 3));
  const damped = d + (10 - d) * delta / 9;
  return clampD(W[7] * initD(4) + (1 - W[7]) * damped);
}
function nextS(d, s, R, r) {
  let v;
  if (r === 1) {
    const lt = W[11] * Math.pow(d, -W[12]) * (Math.pow(s + 1, W[13]) - 1) * Math.exp((1 - R) * W[14]);
    v = Math.min(lt, s / Math.exp(W[17] * W[18]));
  } else {
    const hp = r === 2 ? W[15] : 1, eb = r === 4 ? W[16] : 1;
    v = s * (1 + Math.exp(W[8]) * (11 - d) * Math.pow(s, -W[9]) * (Math.exp((1 - R) * W[10]) - 1) * hp * eb);
  }
  return Math.max(v, S_MIN);
}
function updateMemory(c, r, days, now) {
  if (c.s == null || c.d == null) { c.s = initS(r); c.d = clampD(initD(r)); }
  else if (days != null && days < 1) { c.s = shortS(c.s, r); c.d = nextD(c.d, r); }
  else { c.s = nextS(c.d, c.s, retrievability(c, now), r); c.d = nextD(c.d, r); }
}
function stepInterval(c, r, steps) {
  const graduate = () => { c.state = 2; c.step = 0; return ivlDays(c.s) * DAY; };
  if (!steps.length || (c.step >= steps.length && r !== 1)) return graduate();
  if (r === 1) { c.step = 0; return steps[0]; }
  if (r === 2) {
    if (c.step === 0 && steps.length === 1) return steps[0] * 1.5;
    if (c.step === 0) return (steps[0] + steps[1]) / 2;
    return steps[Math.min(c.step, steps.length - 1)];
  }
  if (r === 3) { if (c.step + 1 >= steps.length) return graduate(); c.step += 1; return steps[c.step]; }
  return graduate();
}
/** FSRS-6 (som py-fsrs 6.x utan fuzz). r: 1 Igen, 2 Svårt, 3 Bra, 4 Lätt. */
function review(c0, r, now) {
  const c = { ...c0 };
  const days = c.last != null ? wholeDays(c.last, now) : null;
  let ivl;
  if (c.state === 2 && r === 1) c.lapses += 1;
  if (c.state === 0 || c.state === 1) {
    if (c.state === 0) { c.state = 1; c.step = 0; }
    updateMemory(c, r, days, now);
    ivl = stepInterval(c, r, LEARN);
  } else if (c.state === 2) {
    c.s = (days != null && days < 1) ? shortS(c.s, r) : nextS(c.d, c.s, retrievability(c, now), r);
    c.d = nextD(c.d, r);
    if (r === 1 && RELEARN.length) { c.state = 3; c.step = 0; ivl = RELEARN[0]; }
    else ivl = ivlDays(c.s) * DAY;
  } else {
    updateMemory(c, r, days, now);
    ivl = stepInterval(c, r, RELEARN);
  }
  c.due = now + ivl; c.last = now; c.reps += 1;
  return c;
}
function preview(c, now) { const o = {}; for (const r of [1, 2, 3, 4]) o[r] = review(c, r, now).due - now; return o; }
function ivlText(ms) {
  const s = ms / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + " min";
  if (s < 86400) return Math.round(s / 3600) + " h";
  const d = s / 86400;
  if (d < 31) return Math.round(d) + " d";
  if (d < 365) return Math.round(d / 30) + " mån";
  return (d / 365).toFixed(1).replace(".", ",") + " år";
}

/* --- Stavning --- */
const norm = s => String(s).trim().toLowerCase();
const isCorrect = (e, t) => norm(e) === norm(t);
/** Bokstavsdiff. op: m (rätt), s (fel bokstav), miss (saknas), x (extra). */
function diff(expected, typed) {
  const e = [...String(expected).trim()], t = [...String(typed).trim()];
  const el = e.map(c => c.toLowerCase()), tl = t.map(c => c.toLowerCase());
  const n = e.length, m = t.length;
  const dp = Array.from({ length: n + 1 }, (_, i) => Array.from({ length: m + 1 }, (_, j) => (i === 0 ? j : j === 0 ? i : 0)));
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++) {
    dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + (el[i - 1] === tl[j - 1] ? 0 : 1));
  }
  const ops = [];
  let i = n, j = m;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && el[i - 1] === tl[j - 1] && dp[i][j] === dp[i - 1][j - 1]) { ops.push({ op: "m", e: e[i - 1] }); i--; j--; }
    else if (i > 0 && dp[i][j] === dp[i - 1][j] + 1) { ops.push({ op: "miss", e: e[i - 1] }); i--; }
    else if (j > 0 && dp[i][j] === dp[i][j - 1] + 1) { ops.push({ op: "x", t: t[j - 1] }); j--; }
    else { ops.push({ op: "s", e: e[i - 1], t: t[j - 1] }); i--; j--; }
  }
  return ops.reverse();
}
/** Redigeringsavstånd där "ie"/"ei"-omkastning räknas som ett fel. */
function distance(expected, typed) {
  const a = [...norm(expected)], b = [...norm(typed)];
  const n = a.length, m = b.length;
  if (!n) return m; if (!m) return n;
  const d = Array.from({ length: n + 1 }, (_, i) => Array.from({ length: m + 1 }, (_, j) => (i === 0 ? j : j === 0 ? i : 0)));
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++) {
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
  }
  return d[n][m];
}
/** Helt rätt = Bra (Lätt om snabbt), ett litet fel = Svårt, mer = Igen. */
function suggestRating(expected, typed, seconds) {
  const dist = distance(expected, typed);
  if (dist === 0) return seconds <= 3 + 0.35 * [...expected].length ? 4 : 3;
  if (dist === 1 && [...norm(expected)].length >= 4) return 2;
  return 1;
}
function checkWordInSentence(word, sentence) {
  const target = norm(word), parts = target.split(/\s+/).length;
  const tokens = String(sentence).split(/[^\p{L}'’-]+/u).filter(Boolean);
  const cands = [];
  for (let i = 0; i + parts <= tokens.length; i++) cands.push(tokens.slice(i, i + parts).join(" "));
  if (cands.some(c => norm(c) === target)) return { correct: true, closest: null };
  let best = null, bd = Infinity;
  for (const c of cands) { const dd = distance(target, c); if (dd < bd) { bd = dd; best = c; } }
  return { correct: false, closest: best != null && bd <= Math.max(2, Math.floor([...target].length / 2)) ? best : null };
}

/* --- Felmönster --- */
const SILENT = ["stle", "dn", "kn", "wr", "mb", "gn", "ps", "rh", "bt", "mn", "pt", "wh", "gh"];
const GROUPS = ["ough", "augh", "eigh", "ssion", "cious", "tious", "tion", "sion", "ture", "ious", "eous",
  "ible", "able", "ance", "ence", "ary", "ery", "ory", "que", "gue", "dge", "tch", "igh",
  "ght", "aoi", "sch", "eou", "ei", "ie", "ea", "ph", "ch", "sh", "th", "ck", "sc", "ci",
  "ce", "ai", "ay", "ou", "ow", "ee", "oo", "ue", "ui", "oi", "oy", "au", "aw", "ew", "eo",

const ALL_GROUPS = SILENT.map(g => [g, true]).concat(GROUPS.map(g => [g, false])).sort((a, b) => b[0].length - a[0].length);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

function entries() {
  const out = [];
  for (const w of Object.values(words)) for (const sk of ["pron", "spell"]) out.push({ wid: w.id, skill: sk, card: w.cards[sk], created: w.created, level: w.level || 3 });

function introducedToday() {

const MODE_TITLE = { daily: "Dagens pass", more: "Fler kort", hard: "Svåra ord", traps: "Stavningsfällor", extraNew: "Nya ord" };
function trapPlan(limit = 15) {
  const top = topPatterns(5);
  if (!top.length) return [];
  const keys = new Set(top.map(([k]) => k));
  const ex = new Set(top.flatMap(([, p]) => p.examples.map(norm)));
  const list = entries().filter(e => {
    if (e.skill !== "spell" || e.card.state === 0) return false;
    const w = words[e.wid];
    return ex.has(norm(w.text)) || [...patternKeysIn(w.text)].some(k => keys.has(k));
  }).sort((a, b) => (ex.has(norm(words[b.wid].text)) - ex.has(norm(words[a.wid].text))) || ((a.card.s || 0) - (b.card.s || 0)));
  return list.slice(0, limit);
}
function startSession(mode, count) {
  const now = Date.now(), all = entries();
  let plan;
  if (mode === "daily") plan = dailyPlan(all, now, S().newPerDay, introducedToday());
  else if (mode === "more") plan = morePlan(all, now);
  else if (mode === "hard") plan = hardPlan(all);
  else if (mode === "traps") plan = trapPlan();
  else plan = spreadSameWord(newForToday(all, count));
  session = { mode, queue: plan.map(e => ({ wid: e.wid, skill: e.skill })), total: plan.length, results: [], start: now,
    limit: mode === "daily" ? S().minutes * 60e3 : null, timeUp: false, done: false };
  view = "session";
  nextCard();
}
function nextCard() {
  Rec.reset(); Speech.stop();
  while (session.queue.length && !words[session.queue[0].wid]) session.queue.shift();
  if (session.timeUp || !session.queue.length) { session.done = true; ui = {}; render(); return; }
  const it = session.queue[0];
  ui = { phase: it.skill === "pron" ? "prompt" : "answering", shownAt: Date.now(), typed: "", retry: "", key: uid() };
  render();
  window.scrollTo(0, 0);
  if (it.skill === "spell") { Speech.play(dictationSteps(words[it.wid], false)).then(() => { if (ui.phase === "answering" && !ui.typed) ui.shownAt = Date.now(); }); }
}
function rate(r) {
  const it = session.queue[0], w = words[it.wid];
  const now = Date.now();
  const card = w.cards[it.skill];
  const updated = review(card, r, now);
  updated.introduced = card.introduced || now;
  updated.agains = (card.agains || 0) + (r === 1 ? 1 : 0);
  w.cards[it.skill] = updated;
  // Dagsstatistik
  const dk = dayKey(now), day = profile.days[dk] || (profile.days[dk] = { pt: 0, pp: 0, st: 0, sp: 0 });
  if (it.skill === "pron") { day.pt++; if (r > 1) day.pp++; } else { day.st++; if (r > 1) day.sp++; }
  if (it.skill === "spell" && ui.typed && !isCorrect(w.text, ui.typed)) registerMistakes(w.text, ui.typed);
  session.results.push({ text: w.text, skill: it.skill, r });
  session.queue.shift();
  if ((updated.state === 1 || updated.state === 3) && updated.due - now < 20 * 60e3) requeue(session.queue, it);

const APP_BUILD = "__BUILD__";   // ersätts med publiceringstiden när appen läggs ut på GitHub Pages
const IS_PWA = !(window.claude && window.claude.use);
const Updates = {
  reg: null, reloading: false,
  start() {

    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && this.reg) this.reg.update().catch(() => {}); });
  },
  /** Byt till ny version, men aldrig mitt i ett pass. */
  maybeApply(force) {
    const w = this.reg && this.reg.waiting;

    if (isCorrect(w.text, ui.typed)) {
      return `<div class="card flash-ok"><h2 style="color:var(--good)">Rätt!</h2><div class="word-big" style="text-align:left;padding:0">${esc(w.text)}</div>${sv(w).replace('class="sv', 'style="text-align:left" class="sv')}${info("⚠️", "Fälla", w.trap)}</div>
      <p class="muted small">Förslag: ${RATING_LABEL[ui.suggested]}. Ändra om du vill.</p>${ratingButtons(card, ui.suggested)}`;
    }
    return `<h2 style="color:var(--again)" class="flash-bad">Inte riktigt</h2>
    ${diffHtml(w.text, ui.typed)}
    ${sv(w)}
    <div class="card">${info("✂️", "Delar", w.syll || w.text)}${info("⚠️", "Fälla", w.trap)}${info("💡", "Minnesbild", w.mnemo)}</div>
    <button class="btn primary" data-act="retryShow">Skriv igen från minnet</button>
    <button class="btn ghost" data-act="skipRetry">Hoppa över</button>`;
  }
  if (ui.phase === "retryShow") {
    return `<h2>Titta noga</h2><div class="word-big">${esc(w.syll || w.text)}</div>
    <div class="card">${info("⚠️", "Fälla", w.trap)}</div>
    <p class="muted" style="text-align:center" id="countdown">Döljs om 3…</p>`;
  }
  if (ui.phase === "retryTyping") {
    return `<h2>Skriv det nu ur minnet</h2>
    <form data-form="retry" class="stack">${answerInput("ans2", ui.retry)}<button class="btn primary" type="submit">Kontrollera</button></form>`;
  }
  // retryResult
  const ok = ui.retry && isCorrect(w.text, ui.retry);
  return `${ui.retry ? (ok ? `<h2 style="color:var(--good)">Nu satt det!</h2>` : `<h2 style="color:var(--hard)">Nästan – kortet kommer snart igen</h2>${diffHtml(w.text, ui.retry)}`) : ""}
  <div class="word-big">${esc(w.text)}</div>${sv(w)}
  <p class="muted small">Förslag: ${RATING_LABEL[ui.suggested]}. Ändra om du vill.</p>${ratingButtons(card, ui.suggested)}`;
}

  r.forEach(e => { if (e.r <= 2) score[e.text] = (score[e.text] || 0) + (e.r === 1 ? 3 : 1); });

function sentenceWords(n) {
  const list = Object.values(words).filter(w => w.cards.pron.state === 2 || w.cards.spell.state === 2);
  for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
  return list.slice(0, n);
}

/* --- Statistik --- */
function chartSvg(days) {
  const keys = [];
  const d = new Date(); d.setHours(12, 0, 0, 0);
  for (let i = days - 1; i >= 0; i--) { const x = new Date(d); x.setDate(d.getDate() - i); keys.push(dayKey(x)); }
  const Wd = 340, H = 180, L = 36, R = 10, T = 12, B = 26;
  const x = i => L + (keys.length === 1 ? 0 : i * (Wd - L - R) / (keys.length - 1));
  const y = v => T + (100 - v) * (H - T - B) / 100;
  const series = [["pt", "pp", "var(--pron)"], ["st", "sp", "var(--spell)"]].map(([tot, pass, color]) => {
    const pts = keys.map((k, i) => { const day = profile.days[k]; return day && day[tot] ? [x(i), y(100 * day[pass] / day[tot])] : null; }).filter(Boolean);
    if (!pts.length) return "";
    return `<polyline fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p => p.join(",")).join(" ")}"/>` +
      pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${color}"/>`).join("");
  }).join("");
  const grid = [0, 50, 100].map(v => `<line x1="${L}" x2="${Wd - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v} %</text>`).join("");
  const fmt = k => { const [, m, dd] = k.split("-"); return `${+dd}/${+m}`; };
  const labels = `<text x="${x(0)}" y="${H - 6}" text-anchor="start">${fmt(keys[0])}</text><text x="${x(keys.length - 1)}" y="${H - 6}" text-anchor="end">${fmt(keys[keys.length - 1])}</text>`;
  return `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Träffsäkerhet per dag för uttal och stavning">${grid}${labels}${series}</svg>`;
}

    <h3>Backup och flytt</h3>
    <p class="muted small">Spara alla ord, ditt schema och din statistik i en fil eller som text. Läs in den i den andra appen (eller i samma, om du bytt telefon).</p>
    <div class="btns"><button class="btn small" data-act="exportBackup">Exportera fil</button><button class="btn small" data-act="copyBackup">Kopiera som text</button></div>
    ${ui.showBackupText ? `<div class="field"><label for="backupOut">Markera allt och kopiera</label><textarea id="backupOut" readonly style="font-family:var(--font-mono);font-size:12px">${esc(backupText())}</textarea></div>` : ""}
    <h3 style="margin-top:6px">Importera</h3>
    ${ui.pendingImport ? `
      <div class="banner">Backupen har ${Object.keys(ui.pendingImport.words).length} ord${ui.pendingImport.exportedAt ? ", sparad " + esc(new Date(ui.pendingImport.exportedAt).toLocaleString("sv-SE", { dateStyle: "medium", timeStyle: "short" })) : ""}. Den <strong>ersätter</strong> allt du har nu (${Object.keys(words).length} ord).</div>
      <div class="btns"><button class="btn small" data-act="cancelImport">Avbryt</button><button class="btn primary small" data-act="doImport">Ersätt</button></div>`
    : `
      <div class="field"><label for="importFile">Välj backupfil</label><input id="importFile" type="file" accept=".json,application/json,text/plain"></div>
      <div class="field"><label for="importText">…eller klistra in texten</label><textarea id="importText" autocorrect="off" autocapitalize="off" spellcheck="false" style="font-family:var(--font-mono);font-size:12px"></textarea></div>
      <button class="btn small" data-act="readImportText">Läs in text</button>
      ${ui.importError ? `<p style="color:var(--again)">${esc(ui.importError)}</p>` : ""}`}
  </div>
  <div class="card">
    <h3>Så fungerar det</h3>
    <p class="muted small">Du plockar fram ordet ur minnet innan du ser eller hör facit, och facit kommer direkt efteråt. Uttal och stavning schemaläggs var för sig med FSRS, med målet att du minns 90 %. Ord du nästan glömt är bäst att repetera, därför kan intervallen kännas långa.</p>
    <p class="muted small">${Store.mode === "db" ? "Dina ord sparas på ditt claude.ai-konto och följer med mellan iPhone och Chromebook." : IS_PWA ? "Dina ord sparas i telefonen. Gör en backup ibland." : "Dina ord sparas i den här webbläsaren."}</p>
  </div>`;
}

/* ===== Händelser ===== */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const act = el.dataset.act, arg = el.dataset.arg;
  const it = session && session.queue[0], w = it && words[it.wid];
  switch (act) {
    case "tab": Speech.stop(); session = null; setTab(arg); Updates.maybeApply(); break;
    case "go": Speech.stop(); if (arg === "extra" || arg === "sentence") { session = null; } view = arg; ui = {}; render(); window.scrollTo(0, 0); break;
    case "start": startSession(arg); break;
    case "startNew": startSession("extraNew", ui.extraNew); break;
    case "extraNew": ui.extraNew = Math.max(1, Math.min(10, ui.extraNew + +arg)); render(); break;
    case "endSession": session.done = true; Speech.stop(); Rec.reset(); render(); break;
    case "finish": session = null; view = "home"; ui = {}; render(); Updates.maybeApply(); break;
    // Uttal
    case "mic": if (Rec.recording) Rec.stop(); else Rec.start().then(render); render(); break;
    case "reveal":
      Rec.stop(); ui.answerSec = (Date.now() - ui.shownAt) / 1000; ui.phase = "answer"; render();
      Speech.say(w.text).then(ok => { if (ok && Rec.url) wait(250).then(() => Rec.play()); });
      break;
    case "say": Speech.say(w ? w.text : ""); break;
    case "saySlow": Speech.say(w.text, true); break;
    case "playMe": Speech.stop(); Rec.play(); break;
    case "compare": Speech.say(w.text).then(ok => { if (ok) wait(250).then(() => Rec.play()); }); break;
    case "pronAgain": haptic("bad"); ui.phase = "again"; render(); Speech.say(w.text, true); break;
    // Stavning
    case "dictate": Speech.play(dictationSteps(w, false)); break;
    case "dictateSlow": Speech.play(dictationSteps(w, true)); break;
    case "retryShow": {
      ui.phase = "retryShow"; render();
      const key = ui.key; let n = 3;
      const tick = () => {
        if (ui.key !== key || ui.phase !== "retryShow") return;
        n--; const c = document.getElementById("countdown");
        if (n > 0) { if (c) c.textContent = `Döljs om ${n}…`; setTimeout(tick, 1000); }
        else { ui.phase = "retryTyping"; ui.retry = ""; render(); }
      };
      setTimeout(tick, 1000);
      break;
    }
    case "skipRetry": ui.retry = ""; ui.phase = "retryResult"; render(); break;
    case "rate": if (it && it.skill === "pron" && ui.phase !== "again") haptic(+arg > 1 ? "ok" : "bad"); rate(+arg); break;
    // Mening
    case "sentNext": ui.i++; ui.sentence = ""; ui.check = null; render(); break;
    // Ord
    case "newWord": view = "edit"; ui = {}; render(); window.scrollTo(0, 0); break;
    case "editWord": view = "edit"; ui = { id: arg }; render(); window.scrollTo(0, 0); break;
    case "kind": syncForm(); ui.form.kind = arg; render(); break;
    case "level": syncForm(); ui.form.level = arg; render(); break;
    case "postpone": {
      const pw = words[ui.id]; const now = Date.now();
      pw.cards = { pron: newCard(now), spell: newCard(now) }; pw.created = now;
      Store.saveWord(pw); toast(`”${pw.text}” kommer tillbaka senare`); view = "words"; ui = {}; render(); break;
    }
    case "sayField": { const t = document.getElementById("f-text").value.trim(); if (t) Speech.say(t); break; }
    case "askDelete": syncForm(); ui.confirmDelete = true; render(); break;
    case "cancelDelete": syncForm(); ui.confirmDelete = false; render(); break;
    case "doDelete": Store.deleteWord(ui.id); toast("Ordet raderades"); view = "words"; ui = {}; render(); break;
    // Statistik och inställningar
    case "range": ui.range = +arg; render(); break;
    case "accent": S().accent = arg; Store.saveProfile(); render(); Speech.say("Siobhan bought a receipt on Wednesday."); break;
    case "testVoice": Speech.say("Siobhan bought a receipt on Wednesday."); break;
    case "newPerDay": S().newPerDay = Math.max(1, Math.min(20, S().newPerDay + +arg)); Store.saveProfile(); render(); break;
    case "minutes": S().minutes = +arg; Store.saveProfile(); render(); break;
    case "checkUpdate":
      ui.updMsg = "Söker…"; render();
      Updates.check().then(r => {
        ui.updMsg = r === "ny" ? "Ny version hittad. Appen laddas om…" : r === "senaste" ? "Du har senaste versionen." : r === "reload" ? "Laddar om…" : "Kunde inte söka just nu. Kontrollera att du har nät.";
        if (view === "settings") render();
      });
      break;
    case "exportBackup": exportBackup(); break;
    case "copyBackup": copyBackup(); break;
    case "readImportText": readBackup(document.getElementById("importText").value); break;
    case "cancelImport": ui.pendingImport = null; render(); break;
    case "doImport": importBackup(ui.pendingImport); ui.pendingImport = null; toast("Backupen är inläst"); render(); break;
  }
});
function syncForm() {
  if (!ui.form) return;
  app.querySelectorAll("[data-f]").forEach(el => { ui.form[el.dataset.f] = el.value; });
  const det = app.querySelector("details"); if (det) ui.more = det.open;
}
document.addEventListener("input", e => {
  if (e.target.id === "ans") ui.typed = e.target.value;
  else if (e.target.id === "ans2") ui.retry = e.target.value;
  else if (e.target.id === "sent") ui.sentence = e.target.value;
  else if (e.target.id === "search") {
    ui.q = e.target.value;
    const l = document.getElementById("wordlist"); if (l) l.innerHTML = wordListHtml();
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "playSentence") { S().playSentence = e.target.checked; Store.saveProfile(); }
  if (e.target.id === "importFile" && e.target.files && e.target.files[0]) {
    const r = new FileReader();
    r.onload = () => readBackup(r.result);
    r.onerror = () => { ui.importError = "Kunde inte läsa filen."; render(); };
    r.readAsText(e.target.files[0]);
  }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const form = e.target.dataset.form;
  const it = session && session.queue[0], w = it && words[it.wid];
  if (form === "spell") {
    const typed = document.getElementById("ans").value;
    if (!typed.trim()) return;
    Speech.stop();
    ui.typed = typed;
    const secs = (Date.now() - ui.shownAt) / 1000;
    ui.suggested = suggestRating(w.text, typed, secs);
    const ok = isCorrect(w.text, typed);
    haptic(ok ? "ok" : "bad");
    ui.phase = "result"; render();
    if (!ok) Speech.say(w.text);
  } else if (form === "retry") {
    const typed = document.getElementById("ans2").value;
    if (!typed.trim()) return;
    ui.retry = typed; haptic(isCorrect(w.text, typed) ? "ok" : "bad");
    ui.phase = "retryResult"; render();
  } else if (form === "sentence") {
    const sw = words[ui.list[ui.i]];
    ui.sentence = document.getElementById("sent").value;
    if (!ui.sentence.trim()) return;
    ui.check = checkWordInSentence(sw.text, ui.sentence);
    haptic(ui.check.correct ? "ok" : "bad");
    if (!ui.check.correct && ui.check.closest) { registerMistakes(sw.text, ui.check.closest); Store.saveProfile(); }
    render();
  } else if (form === "word") {
    syncForm();
    const f = ui.form, text = f.text.trim();
    if (!text) return;
    if (wordExists(text, ui.id)) { ui.dup = true; haptic("bad"); render(); return; }
    const level = f.level ? +f.level : estimateLevel(text, f.kind);
    const fields = { level, text, kind: f.kind, guide: f.guide.trim(), syll: f.syll.trim(), trap: f.trap.trim(), mnemo: f.mnemo.trim(),
      example: f.example.trim(), translation: f.translation.trim(), tags: f.tags.split(",").map(t => t.trim()).filter(Boolean) };
    let target;
    if (ui.id && words[ui.id]) { target = words[ui.id]; Object.assign(target, fields); }
    else { target = makeWord(text, f.kind, fields); words[target.id] = target; }
    Store.saveWord(target);
    haptic("ok"); toast(ui.id ? "Sparat" : `”${text}” är tillagt`);
    view = "words"; ui = {}; render();
  } else if (form === "import") {
    const raw = document.getElementById("imp").value, mode = document.getElementById("impkind").value;
    const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    let added = 0, skipped = 0; const seen = new Set(); const base = Date.now();
    lines.forEach((line, i) => {
      if (seen.has(norm(line)) || wordExists(line)) { skipped++; return; }
      seen.add(norm(line));
      const kind = mode === "auto" ? (/^\p{Lu}/u.test(line) ? "name" : "word") : mode;
      const bk = BANK_BY_TEXT.get(line.toLowerCase());
      const nw = makeWord(line, kind, { created: base + i, level: bk ? bk[2] : estimateLevel(line, kind) });
      words[nw.id] = nw; Store.saveWord(nw); added++;
    });
    ui.importResult = `${added} ord tillagda${skipped ? `, ${skipped} hoppades över` : ""}.`;
    render();
  }
});

/* ===== Start ===== */
Updates.start();
Store.init().then(() => {
  const moved = migrate();
  ready = true; render();
  if (moved) toast(`${moved} svåra namn flyttades till senare. Du börjar med enklare ord.`);
});
</script>
